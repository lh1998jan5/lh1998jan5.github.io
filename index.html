  /* 把配置里的图片名统一成 backgroundList() 里的完整路径 */
  function bgPath(name) {
    if (!name || typeof name !== 'string') return '';

    var list = backgroundList();
    var raw = name.trim().replace(/^\.?\//, '');
    if (CONFIG.backgroundDir && raw.indexOf(CONFIG.backgroundDir) === 0) {
      raw = raw.slice(CONFIG.backgroundDir.length);
    }

    var full = CONFIG.backgroundDir + raw;
    return list.indexOf(full) !== -1 ? full : '';
  }

  function readStored() {
    try {
      var raw = localStorage.getItem(CONFIG.storageKey);
      return raw ? JSON.parse(raw) : null;
    } catch (e) { return null; }
  }

  function writeStored(obj) {
    try {
      localStorage.setItem(CONFIG.storageKey, JSON.stringify(obj));
      return true;
    } catch (e) { return false; }
  }

  function bgSettings() {
    return ACTIVE_CONFIG.background || defaultBackground();
  }

  /* 是否真的在配置里写了名单；没写时用默认探测名，失败不必打扰用户 */
  function bgHasDeclaredList() {
    return !!(ACTIVE_CONFIG && ACTIVE_CONFIG.backgrounds && ACTIVE_CONFIG.backgrounds.length);
  }

  function bgIntervalMs() {
    var b = bgSettings();
    var unit = b.mode === 'minute' ? 60e3 : (b.mode === 'hour' ? 3600e3 : 86400e3);
    return unit * Math.max(1, b.every || 1);
  }

  /* 路径里如果有空格、#、? 或中文，逐段编码，避免图片加载不到 */
  function bgUrl(src) {
    return String(src).split('/').map(function (part) {
      return encodeURIComponent(part);
    }).join('/');
  }

  /* ---------- 响应式尺寸档位 ----------
     同一张照片可以额外生成 1280 / 2560 两档（运行 scripts/make-bg-variants.sh），
     页面按「视口宽度 × 像素比」挑一档，手机不必下载 2–6MB 的原图。
     某一档不存在时自动退回下一档，最后退回原图；新加照片没有生成变体也能正常显示。 */
  var BG_VARIANTS = [
    { dir: '1280/', width: 1280 },
    { dir: '2560/', width: 2560 }
  ];

  function bgTierDir() {
    var w = window.innerWidth || document.documentElement.clientWidth || 1024;
    var dpr = Math.min(window.devicePixelRatio || 1, 3);
    // 允许 13% 的轻微放大，避免为了几十像素白白多下一档
    var need = w * dpr * 0.87;

    for (var i = 0; i < BG_VARIANTS.length; i++) {
      if (need <= BG_VARIANTS[i].width) return BG_VARIANTS[i].dir;
    }
    return '';
  }

  var bgTier = bgTierDir();      // 当前使用的档位，屏幕变化时对比用

  /* 依次尝试：合适的一档变体 → 原图 */
  function bgCandidates(src) {
    var out = [];
    var dir = bgTierDir();
    var cut = src.lastIndexOf('/') + 1;

    if (dir) out.push(src.slice(0, cut) + dir + src.slice(cut));
    out.push(src);
    return out;
  }

  /* 两层交叉淡化：新图在备用层铺好，再淡入，旧图随后释放。
     只允许最后一次请求落地，快速连点时旧图的计时器不会把新图层清掉。 */
  function applyBackground(src, onReady) {
    if (!src) return;

    var token = ++bgToken;
    bgPending = src;
    var urls = bgCandidates(src);
    var index = 0;

    function giveUp() {
      if (token !== bgToken) return;
      bgPending = '';
      bgFailed[src] = true;

      // 坏图直接跳过；固定模式下等下一张加载成功后再钉死
      if (bgSettings().mode === 'fixed') bgPinFixed = true;
      if (!switchBackground(false) && !bgWarned && bgHasDeclaredList()) {
        bgWarned = true;
        toast('有背景图加载失败');
      }
    }

    function show(url) {
      if (token !== bgToken) return;
      bgPending = '';
      delete bgFailed[src];

      // 在图片真正加载完的这一刻再选层，不能提前捕获
      var layers = [el.bgPhoto, el.bgPhoto2];
      var outgoing = layers[bgActive];
      var incoming = layers[1 - bgActive];
      var img = incoming.querySelector('img');
      if (!img) { giveUp(); return; }

      // 只换 <img> 的 src，尺寸和位置交给 CSS 的 object-fit:cover，
      // 这样任何长宽比、任何分辨率的照片都是等比铺满，不会被拉伸
      img.src = bgUrl(url);
      incoming.style.zIndex = '-1';
      outgoing.style.zIndex = '-2';

      incoming.classList.remove('is-ready');
      // 下一帧再开启透明度过渡，避免和设置图片挤在同一帧里
      setTimeout(function () {
        if (token !== bgToken) return;
        incoming.classList.add('is-ready');
      }, 20);

      bgActive = 1 - bgActive;
      bgCurrent = src;

      // 旧图只由当前这次切换负责清理；快速连点时先取消上一个计时器
      clearTimeout(bgClearTimer);
      bgClearTimer = setTimeout(function () {
        if (token !== bgToken) return;        // 期间又换了图，别清掉新图层
        outgoing.classList.remove('is-ready');
        var old = outgoing.querySelector('img');
        if (old) old.removeAttribute('src');
      }, 1100);

      if (typeof onReady === 'function') onReady();
    }

    function attempt() {
      if (token !== bgToken) return;
      if (index >= urls.length) { giveUp(); return; }

      var url = urls[index++];
      var probe = new Image();
      var guard = setTimeout(function () {
        probe.onload = null;
        probe.onerror = null;
        attempt();                            // 超时就试下一档
      }, 15000);

      probe.onload = function () {
        clearTimeout(guard);
        show(url);
      };
      probe.onerror = function () {
        clearTimeout(guard);
        attempt();                            // 这一档不存在，退回原图
      };

      probe.src = bgUrl(url);
    }

    attempt();
  }

  /* 屏幕变宽时（旋转、拉伸窗口、接外接屏）检查是否需要换更高一档 */
  function initBackgroundTierWatch() {
    var timer = 0;
    function check() {
      clearTimeout(timer);
      timer = setTimeout(function () {
        var next = bgTierDir();
        if (next === bgTier) return;
        bgTier = next;
        if (bgCurrent) applyBackground(bgCurrent);
      }, 400);
    }
    window.addEventListener('resize', check);
    window.addEventListener('orientationchange', check);
  }

  /* 优先避开当前图、正在加载的图，以及本次会话加载失败的图 */
  function pickBackgroundSrc() {
    var list = backgroundList();
    if (!list.length) return '';

    var pool = list.filter(function (s) {
      return !bgFailed[s] && s !== bgCurrent && s !== bgPending;
    });

    if (!pool.length) {
      pool = list.filter(function (s) { return !bgFailed[s] && s !== bgCurrent; });
    }
    if (!pool.length) {
      pool = list.filter(function (s) { return !bgFailed[s]; });
    }
    if (!pool.length) return '';

    return pool[Math.floor(Math.random() * pool.length)];
  }

  function pinFixedBackground(src) {
    var b = bgSettings();
    b.fixed = src;
    writeLocalConfig({ background: b });
    reloadConfig();
    if (el.bgFixed) el.bgFixed.value = src;
  }

  /* manual = 用户拉的绳子；固定模式下等图片真正加载成功后再钉死 */
  function switchBackground(manual) {
    var list = backgroundList();
    if (!list.length) return false;

    var src = pickBackgroundSrc();
    if (!src) {
      bgPinFixed = false;
      return false;
    }

    if (manual) bgPinFixed = bgSettings().mode === 'fixed';

    applyBackground(src, function () {
      writeStored({ src: src, at: Date.now() });
      if (bgPinFixed) {
        var shouldPin = bgSettings().mode === 'fixed';
        bgPinFixed = false;
        if (shouldPin) pinFixedBackground(src);
      }
    });

    return true;
  }

  function manualBackground() {
    if (!switchBackground(true)) {
      toast(backgroundList().length ? '背景图暂时加载不出来，请稍后再试' : '背景目录里还没有图片');
    }
  }

  function checkRotation() {
    var b = bgSettings();
    if (b.mode === 'fixed') return;

    var stored = readStored();
    if (!stored || !stored.at || Date.now() - stored.at >= bgIntervalMs()) {
      switchBackground(false);
    }
  }

  function initBackground() {
    var list = backgroundList();
    if (!list.length) return;

    var b = bgSettings();
    var stored = readStored();
    var saved = bgPath(stored && stored.src);

    if (b.mode === 'fixed') {
      var src = bgPath(b.fixed) || saved || list[0];
      applyBackground(src);
      writeStored({ src: src, at: Date.now() });
      return;
    }

    if (saved && stored.at && Date.now() - stored.at < bgIntervalMs()) {
      applyBackground(saved);                 // 还没到时间 → 沿用
      return;
    }

    switchBackground(false);
  }

  /* 绳子：按住往下拉，松手换一张（点一下也行） */
  /* 窄屏的换背景按钮：点一下转半圈，换一张 */
  function initBgSwitch() {
    var btn = el.bgSwitch;
    if (!btn) return;

    var hintTimer = 0;
    btn.classList.add('is-hint');
    hintTimer = setTimeout(function () { btn.classList.remove('is-hint'); }, 5000);

    btn.addEventListener('click', function () {
      clearTimeout(hintTimer);
      btn.classList.remove('is-hint');
      btn.classList.add('is-turning');
      setTimeout(function () { btn.classList.remove('is-turning'); }, 520);
      manualBackground();
    });
  }

  function initRope() {
    var rope = el.rope;
    if (!rope) return;

    var BASE = 72;               // 静止时绳子高度，和 CSS 保持一致
    var MAX = 150;               // 最多拉这么长
    var startY = 0;
    var dy = 0;
    var dragging = false;
    var activeId = null;

    // 首次进页面轻轻弹一下，提示这根绳子能拉
    rope.classList.add('is-hint');
    rope.addEventListener('animationend', function () {
      rope.classList.remove('is-hint');
    });

    function setPull(v) {
      dy = Math.max(0, Math.min(MAX, v));
      // 拉伸高度而不是整体下移：顶端始终挂在视口上沿
      rope.style.height = (BASE + dy) + 'px';
    }

    function finish(change, id) {
      if (!dragging) return;
      if (id !== undefined && activeId !== null && id !== activeId) return;

      dragging = false;
      activeId = null;
      var pulled = dy;
      dy = 0;

      rope.classList.remove('is-dragging');
      rope.style.height = '';       // 交还给 CSS 过渡，带一点回弹

      // 快速轻拉也算一次，不用非得拉满
      if (change && (pulled >= 40 || pulled < 6)) manualBackground();
    }

    rope.addEventListener('pointerdown', function (e) {
      if (e.button || dragging) return;
      rope.classList.remove('is-hint');
      dragging = true;
      activeId = e.pointerId;
      startY = e.clientY;
      dy = 0;
      rope.classList.add('is-dragging');
      rope.style.height = BASE + 'px';
      try { rope.setPointerCapture(e.pointerId); } catch (err) {}
      e.preventDefault();
    });

    rope.addEventListener('pointermove', function (e) {
      if (!dragging || e.pointerId !== activeId) return;
      setPull(e.clientY - startY);
    });

    rope.addEventListener('pointerup', function (e) { finish(true, e.pointerId); });
    rope.addEventListener('pointercancel', function (e) { finish(false, e.pointerId); });

    // 指针在窗口外松开、或指针捕获丢失时也能复位，避免绳子卡在半截
    window.addEventListener('pointerup', function (e) { finish(true, e.pointerId); });
    window.addEventListener('pointercancel', function (e) { finish(false, e.pointerId); });
    rope.addEventListener('lostpointercapture', function () { finish(false); });
    window.addEventListener('blur', function () { finish(false); });

    rope.addEventListener('click', function (e) {
      if (e.detail === 0) manualBackground();   // 键盘触发的 click
    });
  }

  /* =========================================================
     ⑨ 假期设置：假期 + 自定义活动 + 背景轮换
     ========================================================= */
  var editRows = [];
  var toastTimer = 0;

  function cnDate(d) {
    return d.getFullYear() + '年' + (d.getMonth() + 1) + '月' + d.getDate() + '日';
  }

  function toast(msg) {
    el.toast.textContent = msg;
    el.toast.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { el.toast.classList.remove('show'); }, 2400);
  }

  /* 弹窗里的列表：未来一年 + 一年之外的自定义活动 */
  function modalEntries() {
    var t = today();
    var from = dayNumber(t);
    var to = from + 365;
    var y0 = t.getFullYear();
    var rows = [];

    for (var y = y0; y <= y0 + 2; y++) {
      entriesForYear(y, { includeHidden: true }).forEach(function (e) {
        var d = parseISO(e.start);
        var n = dayNumber(d);
        if (n < from || n > to) return;

        rows.push({
          key: e.key,
          name: e.name,
          start: e.start,
          days: e.days,
          source: e.source,
          yearly: e.yearly,
          hidden: !!e.hidden,
          date: d
        });
      });
    }

    (ACTIVE_CONFIG.custom || []).forEach(function (c) {
      var key = 'c:' + c.id;
      for (var i = 0; i < rows.length; i++) {
        if (rows[i].key === key) return;
      }
      rows.push({
        key: key,
        name: c.name,
        start: c.start,
        days: c.days,
        source: 'custom',
        hidden: false,
        date: parseISO(c.start),
        yearly: c.yearly
      });
    });

    rows.sort(function (a, b) {
      if (a.date - b.date) return a.date - b.date;
      return orderIndex(a.key) - orderIndex(b.key);
    });

    return rows;
  }

  function buildRow(it) {
    var custom = it.source === 'custom';

    var li = document.createElement('li');
    li.className = 'edit-row';

    var nameCell = document.createElement('div');
    nameCell.className = 'er-name';
    var nameInput = null;

    if (custom) {
      nameInput = document.createElement('input');
      nameInput.type = 'text';
      nameInput.maxLength = 12;
      nameInput.value = it.name || '';
      nameInput.placeholder = '活动名称';
      nameInput.title = it.name || '';
      nameInput.setAttribute('aria-label', '活动名称');
      nameCell.appendChild(nameInput);
    } else {
      nameCell.textContent = LABEL[it.key] || it.name || it.key;
    }

    var startInput = document.createElement('input');
    startInput.type = 'date';
    startInput.className = 'er-start';
    startInput.value = it.start;
    startInput.setAttribute('aria-label', (custom ? '活动' : (LABEL[it.key] || it.name || it.key)) + '开始日期');

    var daysInput = document.createElement('input');
    daysInput.type = 'number';
    daysInput.className = 'er-days';
    daysInput.min = '1';
    daysInput.max = '30';
    daysInput.step = '1';
    daysInput.value = String(it.days);
    daysInput.setAttribute('aria-label', '持续天数');

    // 手机上是「名称 + 天数」并排一行，单独一个数字容易看不懂，所以带个单位；
    // 桌面端五列布局本身够清楚，单位通过 CSS 隐藏
    var daysWrap = document.createElement('span');
    daysWrap.className = 'er-days-wrap';
    var daysUnit = document.createElement('i');
    daysUnit.className = 'er-unit';
    daysUnit.setAttribute('aria-hidden', 'true');
    daysUnit.textContent = '天';
    daysWrap.appendChild(daysInput);
    daysWrap.appendChild(daysUnit);

    var range = document.createElement('div');
    range.className = 'er-range';

    var yearlyBox = null;
    if (custom) {
      var yearlyLabel = document.createElement('label');
      yearlyLabel.className = 'er-yearly';
      yearlyBox = document.createElement('input');
      yearlyBox.type = 'checkbox';
      yearlyBox.checked = !!it.yearly;
      yearlyLabel.appendChild(yearlyBox);
      yearlyLabel.appendChild(document.createTextNode('每年'));
      range.appendChild(yearlyLabel);
    }

    var cap = document.createElement('span');
    cap.className = 'er-cap';
    range.appendChild(cap);

    var del = document.createElement('button');
    del.type = 'button';
    del.className = 'er-del';
    del.textContent = '×';
    del.title = '删除';
    del.setAttribute('aria-label', '删除这一项');

    li.appendChild(nameCell);
    li.appendChild(startInput);
    li.appendChild(daysWrap);
    li.appendChild(range);
    li.appendChild(del);
    el.editList.appendChild(li);

    var row = {
      key: it.key,
      base: it,
      custom: custom,
      deleted: !!it.hidden,
      li: li,
      nameInput: nameInput,
      start: startInput,
      days: daysInput,
      cap: cap,
      range: range,
      yearly: yearlyBox,
      del: del
    };

    startInput.addEventListener('input', function () { syncRow(row); });
    daysInput.addEventListener('input', function () { syncRow(row); });
    if (nameInput) {
      nameInput.addEventListener('input', function () {
        nameInput.title = nameInput.value;
        syncRow(row);
      });
      nameInput.addEventListener('blur', function () { nameInput.scrollLeft = 0; });
    }
    if (yearlyBox) yearlyBox.addEventListener('change', function () { syncRow(row); });

    del.addEventListener('click', function () {
      row.deleted = !row.deleted;
      applyDeleted(row);
      if (row.deleted) {
        toast(custom ? '已删除，点「保存修改」生效' : '已隐藏，点「保存修改」生效');
      }
    });

    applyDeleted(row);
    return row;
  }

  function applyDeleted(row) {
    row.li.classList.toggle('is-off', row.deleted);
    row.del.textContent = row.deleted ? '↺' : '×';
    row.del.title = row.deleted ? '恢复' : '删除';
    row.del.classList.toggle('is-undo', row.deleted);

    row.start.disabled = row.deleted;
    row.days.disabled = row.deleted;
    if (row.nameInput) row.nameInput.disabled = row.deleted;
    if (row.yearly) row.yearly.disabled = row.deleted;

    syncRow(row);
  }

  function syncRow(row) {
    if (row.deleted) {
      row.cap.textContent = row.custom ? '已删除' : '已隐藏';
      row.range.classList.remove('is-error');
      return;
    }

    var startVal = row.start.value;
    var daysVal = parseInt(row.days.value, 10);
    var nameVal = row.nameInput ? row.nameInput.value.trim() : '';
    var dateOk = /^\d{4}-\d{2}-\d{2}$/.test(startVal);
    var daysOk = !isNaN(daysVal) && daysVal >= 1 && daysVal <= 30;
    var nameOk = !row.custom || nameVal.length > 0;

    row.start.classList.toggle('is-error', !dateOk);
    row.days.classList.toggle('is-error', !daysOk);
    if (row.nameInput) row.nameInput.classList.toggle('is-error', !nameOk);

    var changed = startVal !== row.base.start || String(daysVal) !== String(row.base.days) ||
      (row.custom && nameVal !== (row.base.name || ''));
    row.li.classList.toggle('is-changed', changed);

    if (!dateOk || !daysOk) {
      row.cap.textContent = !dateOk ? '请选择起止日期' : '天数需在 1–30 之间';
      row.range.classList.add('is-error');
      return;
    }

    row.range.classList.remove('is-error');
    var s = parseISO(startVal);
    var e = new Date(s.getFullYear(), s.getMonth(), s.getDate() + daysVal - 1);
    /* 自定义提醒右侧有「每年」勾选，宽度紧，结束日期只写月日；
       内置节日同一年也省略年份，只有跨年时才补上年份 */
    var endText = (row.custom || e.getFullYear() === s.getFullYear())
      ? (e.getMonth() + 1) + '月' + e.getDate() + '日'
      : cnDate(e);
    row.cap.textContent = '至 ' + endText + '（' + WEEK_SHORT[e.getDay()] + '）· 共 ' + daysVal + ' 天';
  }

  function addRow() {
    var t = today();
    var later = new Date(t.getFullYear(), t.getMonth(), t.getDate() + 7);

    var row = buildRow({
      key: 'c:' + ('n' + Date.now().toString(36)),
      name: '',
      start: iso(later),
      days: 1,
      source: 'custom',
      hidden: false,
      date: later
    });

    editRows.push(row);
    row.li.classList.add('is-changed');
    if (row.nameInput) row.nameInput.value = '';
    syncRow(row);

    if (row.nameInput) {
      row.nameInput.focus();
      if (row.li.scrollIntoView) row.li.scrollIntoView({ block: 'nearest' });
    }
  }

  /* ---------- 背景设置控件 ---------- */
  function renderBackgroundControls() {
    var b = bgSettings();
    var list = backgroundList();

    el.bgMode.value = b.mode;
    el.bgEvery.value = String(b.every);

    el.bgFixed.textContent = '';
    list.forEach(function (src) {
      var o = document.createElement('option');
      o.value = src;
      o.textContent = src.split('/').pop();
      el.bgFixed.appendChild(o);
    });

    var pinned = b.fixed || bgCurrent;
    if (pinned && list.indexOf(pinned) !== -1) el.bgFixed.value = pinned;

    syncBackgroundControls();
  }

  function syncBackgroundControls() {
    var mode = el.bgMode.value;
    var fixed = mode === 'fixed';

    el.bgPre.hidden = fixed;
    el.bgEvery.hidden = fixed;
    el.bgFixed.hidden = !fixed;

    fitModeSelect();
  }

  /* 按当前选中的“分钟 / 小时 / 天 / 固定一张”收紧下拉框宽度，
     让自绘的小箭头紧跟在文字后面，而不是贴在框的最右侧 */
  var fitModeCanvas = null;
  function fitModeSelect() {
    var sel = el.bgMode;
    if (!sel) return;
    var opt = sel.options[sel.selectedIndex];
    var text = opt ? opt.textContent : '';

    var cs = getComputedStyle(sel);
    if (!fitModeCanvas) fitModeCanvas = document.createElement('canvas').getContext('2d');
    if (!fitModeCanvas) { sel.style.width = ''; return; }
    fitModeCanvas.font = cs.fontStyle + ' ' + cs.fontWeight + ' ' + cs.fontSize + ' ' + cs.fontFamily;

    /* 左内边距 10 + 右内边距 26（含箭头与间距）+ 左右边框 2，再留 1px 余量 */
    var width = Math.ceil(fitModeCanvas.measureText(text).width) + 39;
    sel.style.width = Math.max(width, 52) + 'px';
  }

  function readBackgroundControls() {
    var every = Math.round(+el.bgEvery.value);
    if (!isFinite(every) || every < 1) every = 1;
    if (every > 999) every = 999;

    return {
      mode: el.bgMode.value,
      every: every,
      fixed: el.bgFixed.value || ''
    };
  }

  function renderModal() {
    var rows = modalEntries();
    var t = today();
    var end = new Date(t.getFullYear(), t.getMonth(), t.getDate() + 365);

    el.modalSub.textContent = '近一年 · ' + cnDate(t) + ' — ' + cnDate(end) + '，共 ' + rows.length + ' 项';

    var status = [];
    if (FILE_CONFIG) {
      status.push('已加载 holidays.config.js');
    } else {
      status.push('未找到 holidays.config.js，当前使用内置数据');
    }
    if (readLocalConfig()) status.push('本机修改生效中');
    el.modalStatus.textContent = status.join(' · ');
    el.modalStatus.classList.toggle('is-warn', !FILE_CONFIG);

    el.editList.textContent = '';
    editRows = [];

    rows.forEach(function (it) {
      editRows.push(buildRow(it));
    });

    renderBackgroundControls();
  }

  /* 页面跑在 file:// 时，把当前目录显示出来，方便对准文件 */
  function configDir() {
    if (location.protocol !== 'file:') return '';
    try {
      return decodeURIComponent(location.pathname || '').replace(/\/[^/]*$/, '');
    } catch (e) { return ''; }
  }

  /* 线上版本（GitHub Pages 等）：入口文案改成"导出"，并说明改完要提交才生效 */
  function initHostedUI() {
    if (!HOSTED) return;

    if (el.exportBtn) {
      el.exportBtn.textContent = '导出配置';
      el.exportBtn.title = '下载 holidays.config.js；覆盖仓库里的同名文件并提交后，所有人才会看到更新';
    }
    if (el.modalTip) {
      el.modalTip.textContent = '线上版本读取的是仓库里的 holidays.config.js：这里的修改只保存在当前浏览器，' +
        '换设备或清缓存就没了。点「导出配置」下载文件，覆盖仓库里的同名文件并提交，别人才会看到。';
    }
  }

  function openModal() {
    renderModal();

    var dir = configDir();
    el.modalPath.hidden = !dir;
    el.modalPath.textContent = dir ? '配置文件位置：' + dir + '/holidays.config.js' : '';
    el.modal.hidden = false;
    document.body.style.overflow = 'hidden';
    setTimeout(function () {
      if (el.modalCard) el.modalCard.focus();
    }, 20);
  }

  function closeModal() {
    el.modal.hidden = true;
    document.body.style.overflow = '';
    el.settingsBtn.focus();
  }

  /* 把弹窗里当前看到的内容收集成一份配置（不落盘） */
  function collectConfig() {
    var years = {};
    var existing = ACTIVE_CONFIG.years || {};
    Object.keys(existing).forEach(function (y) {
      years[y] = existing[y].map(function (r) {
        return { name: r.name, start: r.start, days: r.days };
      });
    });

    var hidden = [];
    var custom = [];
    var bad = null;

    editRows.forEach(function (row) {
      if (row.deleted) {
        if (!row.custom) hidden.push(row.key);
        return;
      }

      var startVal = row.start.value;
      var daysVal = parseInt(row.days.value, 10);
      var nameVal = row.nameInput ? row.nameInput.value.trim() : '';

      var okName = !row.custom || nameVal.length > 0;
      var okRange = /^\d{4}-\d{2}-\d{2}$/.test(startVal) && !isNaN(daysVal) && daysVal >= 1 && daysVal <= 30;

      if (!okName || !okRange) {
        bad = bad || row;
        return;
      }

      if (row.custom) {
        custom.push({
          id: row.key.slice(2),
          name: nameVal.slice(0, 12),
          start: startVal,
          days: daysVal,
          yearly: !!(row.yearly && row.yearly.checked)
        });
        return;
      }

      var y = startVal.slice(0, 4);

      Object.keys(years).forEach(function (yy) {
        years[yy] = years[yy].filter(function (r) { return r.name !== row.key; });
        if (!years[yy].length) delete years[yy];
      });

      var base = baselineFor(+y, row.key);
      var changed = !base || base.start !== startVal || base.days !== daysVal;

      if (changed) {
        (years[y] = years[y] || []).push({ name: row.key, start: startVal, days: daysVal });
      }
    });

    return {
      bad: bad,
      years: years,
      hidden: hidden,
      custom: custom,
      // 背景名单不在弹窗里编辑，原样保留文件里的顺序
      backgrounds: (FILE_CONFIG && FILE_CONFIG.backgrounds) || [],
      background: readBackgroundControls()
    };
  }

  function warnBad(bad) {
    (bad.nameInput || bad.start).focus();
    toast(bad.custom && !(bad.nameInput.value || '').trim() ? '先给这个提醒起个名字' : '有日期或天数没填好');
  }

  /* 写进本机浏览器（localStorage），不动文件 */
  function applyConfig(cfg) {
    return writeLocalConfig({
      years: Object.keys(cfg.years).length ? cfg.years : null,
      hidden: cfg.hidden.length ? cfg.hidden : null,
      custom: cfg.custom.length ? cfg.custom : null,
      background: cfg.background
    });
  }

  function configFileText(cfg) {
    var payload = {
      updatedAt: new Date().toISOString(),
      years: cfg.years,
      hidden: cfg.hidden,
      custom: cfg.custom,
      backgrounds: cfg.backgrounds || [],
      background: cfg.background
    };

    var head = [
      '/* =========================================================',
      '   holidays.config.js — 本地配置（唯一配置文件）',
      '   导出于 ' + cnDate(new Date()),
      '   与 index.html 放在同一目录，刷新页面即生效，优先级高于内置数据与推算。',
      '   ---------------------------------------------------------',
      '   这个文件同时保存「假期修正 / 自定义提醒」和「背景图名单 / 背景轮换设置」。',
      '',
      '   页面的「假期设置」改完点「保存到文件」，会生成同样格式的',
      '   文件；选中项目里的本文件覆盖即可，背景名单也会一起写进去。',
      '',
      '   下面几个字段都可以只写一部分，没写的继续用内置数据 / 默认值：',
      '',
      '   years    修正内置节日：{ 年份: [{ name, start, days }] }',
      '            name  元旦 / 春节 / 清明 / 劳动节 / 端午 / 中秋 / 国庆',
      '            start 假期首日 YYYY-MM-DD',
      '            days  放假天数（含首日）',
      '',
      "   hidden   不想在倒计时里出现的节日名，比如 ['元旦']",
      '',
      '   custom   自定义提醒（团建、生日、旅行……）',
      '            { id, name, start, days, yearly }',
      '            yearly: true 表示每年重复（只取 start 的月日）',
      '',
      '   backgrounds  背景图名单（照片放在 backgrounds/ 目录）',
      '            一行一个，区分大小写；写文件名或 backgrounds/xxx 都可以。',
      '            留空数组时，页面会尝试 bg-1.jpg … bg-6.jpg 这些默认命名。',
      '',
      '   background   背景轮换',
      "            mode   'minute' | 'hour' | 'day' | 'fixed'",
      '            every  间隔数量（1–999）',
      "            fixed  固定模式下使用的图片，如 'backgrounds/DSC07531.JPG'",
      '',
      '   示例：',
      '     "years": {"2027":[{"name":"元旦","start":"2027-01-01","days":3},{"name":"劳动节","start":"2027-05-01","days":4}]},',
      '     "hidden": ["元旦"],',
      '     "custom": [{"id":"c1","name":"小满生日","start":"2027-05-21","days":1,"yearly":true}],',
      '     "backgrounds": ["DSC07531.JPG", "DSC09069.JPG", "DSC09072.JPG"],',
      '     "background": {"mode":"minute", "every":1, "fixed":"backgrounds/DSC07531.JPG"}',
      '   ========================================================= */',
      'window.HOLIDAY_CONFIG = '
    ].join('\n');

    return head + JSON.stringify(payload, null, 2) + ';\n';
  }

  function saveModal() {
    var cfg = collectConfig();
    if (cfg.bad) { warnBad(cfg.bad); return; }

    if (!applyConfig(cfg)) {
      toast('保存失败：浏览器存储不可用');
      return;
    }

    reloadConfig();
    render();
    initBackground();
    closeModal();
    toast('已保存到本机浏览器');
  }

  function resetToFile() {
    var msg = FILE_CONFIG
      ? '放弃本机修改（含自定义提醒），恢复为 holidays.config.js 的内容？'
      : '未找到配置文件，将清除本机修改并回到内置数据，继续？';
    if (!window.confirm(msg)) return;

    writeLocalConfig(null);
    reloadConfig();
    renderModal();
    render();
    initBackground();
    toast(FILE_CONFIG ? '已恢复为文件内容' : '已清除本机修改');
  }

  function downloadConfig(text) {
    try {
      var blob = new Blob([text], { type: 'text/javascript;charset=utf-8' });
      var url = URL.createObjectURL(blob);
      var a = document.createElement('a');
      a.href = url;
      a.download = 'holidays.config.js';
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      setTimeout(function () { URL.revokeObjectURL(url); }, 2000);
      toast(HOSTED
        ? '已下载 holidays.config.js，覆盖仓库里的同名文件并提交后生效'
        : '已下载 holidays.config.js，用它覆盖项目里的同名文件');
    } catch (e) {
      toast('导出失败：浏览器不支持下载');
    }
  }

  /* 保存到文件：Chrome / Edge 可直接写，其他浏览器退回下载 */
  function saveToFile() {
    var cfg = collectConfig();
    if (cfg.bad) { warnBad(cfg.bad); return; }

    var text = configFileText(cfg);

    // 线上版本写不了仓库里的文件，直接给下载，避免"写了但网站没变"
    if (HOSTED) {
      downloadConfig(text);
      return;
    }

    if (typeof window.showSaveFilePicker !== 'function') {
      downloadConfig(text);
      return;
    }

    var picker;
    try {
      picker = window.showSaveFilePicker({
        suggestedName: 'holidays.config.js',
        types: [{ description: 'JavaScript 配置', accept: { 'text/javascript': ['.js'] } }]
      });
    } catch (e) {
      downloadConfig(text);
      return;
    }

    picker.then(function (handle) {
      return handle.createWritable().then(function (w) {
        return w.write(text).then(function () { return w.close(); }).then(function () { return handle; });
      });
    }).then(function (handle) {
      // 文件写成功：本机也存一份，页面显示和文件保持一致
      applyConfig(cfg);
      FILE_CONFIG = normalizeConfig(cfg);
      reloadConfig();
      render();
      initBackground();
      closeModal();
      toast('已写入 ' + (handle.name || 'holidays.config.js'));
    })['catch'](function (err) {
      if (err && (err.name === 'AbortError' || err.name === 'NotAllowedError')) return;
      downloadConfig(text);
    });
  }

  el.settingsBtn.addEventListener('click', openModal);
  el.saveBtn.addEventListener('click', saveModal);
  el.resetBtn.addEventListener('click', resetToFile);
  el.exportBtn.addEventListener('click', saveToFile);
  el.addBtn.addEventListener('click', addRow);
  el.bgMode.addEventListener('change', syncBackgroundControls);
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(fitModeSelect);
  window.addEventListener('resize', fitModeSelect);
  el.shuffleBtn.addEventListener('click', manualBackground);

  Array.prototype.forEach.call(el.modal.querySelectorAll('[data-close]'), function (node) {
    node.addEventListener('click', closeModal);
  });

  document.addEventListener('keydown', function (e) {
    if (el.modal.hidden) return;

    if (e.key === 'Escape') {
      closeModal();
      return;
    }
    if (e.key !== 'Tab') return;

    var focusables = Array.prototype.filter.call(
      el.modal.querySelectorAll('button, input, select, a[href]'),
      function (n) { return !n.disabled && n.offsetParent !== null; }
    );
    if (!focusables.length) return;

    var first = focusables[0];
    var last = focusables[focusables.length - 1];

    if (!el.modal.contains(document.activeElement)) {
      e.preventDefault();
      first.focus();
    } else if (e.shiftKey && document.activeElement === first) {
      e.preventDefault();
      last.focus();
    } else if (!e.shiftKey && document.activeElement === last) {
      e.preventDefault();
      first.focus();
    }
  });

  /* =========================================================
     ⑩ 启动 + 跨天刷新
     ========================================================= */
  initHostedUI();
  initBackgroundTierWatch();
  render();
  initBackground();
  initRope();
  initBgSwitch();

  var currentDay = iso(today());
  setInterval(function () {
    var d = iso(today());
    if (d !== currentDay) {
      currentDay = d;
      render();
    }
    checkRotation();          // 到点就换背景
  }, 30000);

  document.addEventListener('visibilitychange', function () {
    if (!document.hidden) {
      var d = iso(today());
      if (d !== currentDay) {
        currentDay = d;
        render();
      }
      checkRotation();
    }
  });
})();
</script>
</body>
</html>
